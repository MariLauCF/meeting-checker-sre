apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-checker
  namespace: meeting-checker
  labels:
    app: meeting-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meeting-checker
  template:
    metadata:
      labels:
        app: meeting-checker
    spec:
      containers:
        - name: meeting-checker
          image: meeting-checker:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
