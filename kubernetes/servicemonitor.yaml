apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: meeting-checker
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - meeting-checker

  selector:
    matchLabels:
      app: meeting-checker

  endpoints:
    - port: http
      path: /metrics
      interval: 15s

